<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Livro - BibliotecaWeb</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #253247;
        }

        header {
            background-color: #17365d;
            color: white;
            padding: 30px;
            text-align: center;
        }

        main {
            max-width: 600px;
            margin: 40px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000015;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 25px;
            padding: 12px 20px;
            background-color: #17365d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #28558a;
        }

        .sucesso {
            color: green;
            margin-top: 20px;
        }

        .erro {
            color: red;
            margin-top: 20px;
        }

        a {
            color: #17365d;
        }
    </style>
</head>

<body>
    <header>
        <h1>📚 BibliotecaWeb</h1>
        <p>Cadastro de Livros</p>
    </header>

    <main>
        <h2>Cadastrar novo livro</h2>

        {% if sucesso %}
            <p class="sucesso">
                Livro cadastrado com sucesso!
            </p>
        {% endif %}

        {% if erro %}
            <p class="erro">{{ erro }}</p>
        {% endif %}

        <form method="POST" novalidate>
            <label for="titulo">Título do livro:</label>
            <input
                type="text"
                id="titulo"
                name="titulo"
                value="{{ request.form.get('titulo', '') }}"
            >

            <label for="autor">Autor:</label>
            <input
                type="text"
                id="autor"
                name="autor"
                value="{{ request.form.get('autor', '') }}"
            >

            <label for="quantidade">Quantidade:</label>
            <input
                type="number"
                id="quantidade"
                name="quantidade"
                value="{{ request.form.get('quantidade', '') }}"
            >

            <button type="submit">
                Cadastrar Livro
            </button>
        </form>

        <p>
            <a href="/">Voltar ao início</a>
        </p>
    </main>
</body>
</html>
